<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form</title>
    <link rel="stylesheet" href="./css/normalise.css">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <form class="form">
        <fieldset class="form-group">
            <legend class="form-group-title">Ваши данные</legend>
            <label for="name" class="label">
                Имя
            </label>
            <input class="input" type="text" id="name" name="name" placeholder="Имя" required>
            <label for="age" class="label">
                Ваш возраст
            </label>
            <input class="input" type="number" id="age" name="age" inputmode="numeric" placeholder="Возраст" required >
            <label for="phone" class="label">
                Ваш номер телефона
            </label>
            <input class="input" type="tel" id="phone" name="phone" inputmode="numeric" placeholder="Номер телефона" required>
            <label for="email" class="label">
                Ваша почта
            </label>
            <input class="input" type="email" id="email" name="email" inputmode="email" placeholder="Почта" required>
        </fieldset>
        <fieldset class="form-group">
            <label for="message" class="label">
                Сообщение
            </label>
            <textarea class="textarea" name="message" id="message" placeholder="Ваше сообщение" required></textarea>
            <label class="label checkbox-label">
                <input class="checkbox" type="checkbox" name="checkbox" required>
                <span class="checkbox-text">Я принимаю правила</span>
            </label>
        </fieldset>
        <button class="button">Отправить</button>
    </form>
</body>
</html>
